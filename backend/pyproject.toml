[project]
name = "deskshare-backend"
version = "0.1.0"
description = "DeskSharing BAMF - PoC Backend (FastAPI + SQLite)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.35",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
    "faker>=30.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "behave>=1.2.6",
    "playwright>=1.47.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

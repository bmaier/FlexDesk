<!--
  Governs: EXPERIENCE.md > State Patterns (Fehler — Systemfehler (global)),
  Component Patterns (Empty States), DESIGN.md > Components > Empty States
  (Variante 3: Blockierend mit Aktion).
  Content scope decided 2026-08-18: ganzseitiger Fallback für nicht-kontextspezifische
  Fehler, unterscheidet sich von den bereits vorhandenen kontextuellen Inline-Fehlern
  (Buchungskonflikt, fehlende Vertretung) durch den ganzseitigen Rahmen.
  Tokens from DESIGN.md frontmatter, applied literally (no build step).
-->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Systemfehler — DeskSharing BAMF</title>
<style>
  :root {
    --background: #f7f9fb;
    --surface: #ffffff;
    --surface-container-low: #f2f4f6;
    --surface-container-lowest: #ffffff;
    --outline-variant: #c3c6d1;
    --on-surface: #191c1e;
    --on-surface-variant: #43474f;
    --primary: #001e40;
    --on-primary: #ffffff;
    --error-container: #ffdad6;
    --on-error-container: #93000a;
    --focus-ring: #2563eb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, -apple-system, sans-serif; background: var(--background); color: var(--on-surface); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { text-align: center; max-width: 420px; padding: 48px 24px; }
  .icon-circle { width: 80px; height: 80px; border-radius: 9999px; background: var(--error-container); margin: 0 auto 24px; display: flex; align-items: center; justify-content: center; }
  h1 { font-size: 24px; font-weight: 600; margin: 0 0 10px; }
  p { font-size: 14px; color: var(--on-surface-variant); line-height: 1.5; margin: 0 0 28px; }
  .actions { display: flex; gap: 12px; justify-content: center; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 22px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-primary { background: var(--primary); color: var(--on-primary); }
  .btn-secondary { background: var(--surface-container-low); color: var(--on-surface); }
  .btn:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .error-code { font-family: ui-monospace, monospace; font-size: 12px; color: var(--on-surface-variant); margin-top: 24px; }
</style>
</head>
<body>
  <div class="card" role="alert">
    <div class="icon-circle" aria-hidden="true">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#93000a" stroke-width="2"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>
    </div>
    <h1>Etwas ist schiefgelaufen</h1>
    <p>Die Anfrage konnte nicht verarbeitet werden. Ihre Daten sind nicht verloren gegangen — versuchen Sie es erneut oder melden Sie das Problem, falls es weiter besteht.</p>
    <div class="actions">
      <button class="btn btn-primary">Erneut versuchen</button>
      <button class="btn btn-secondary">Problem melden</button>
    </div>
    <div class="error-code">Fehlercode: DS-500-7f3a</div>
  </div>
</body>
</html>
